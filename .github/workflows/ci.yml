name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Typecheck, unit tests, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      # No Supabase env here, so the local-stack integration tests skip; the
      # database job below runs them for real.
      - run: pnpm test
      - run: pnpm run build

  database:
    name: Supabase (pgTAP + integration tests)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: supabase/setup-cli@v1
        with:
          # Pinned to the version used locally. "latest" made CI depend on a GitHub
          # API lookup that can be rate limited, and let the CLI change under us.
          version: 2.121.0

      - name: Start local Supabase
        run: supabase start -x studio,imgproxy,edge-runtime,mailpit

      - name: Apply migrations and seed
        run: supabase db reset

      - name: Export local stack credentials
        run: |
          eval "$(supabase status -o env)"
          echo "::add-mask::$ANON_KEY"
          echo "::add-mask::$SERVICE_ROLE_KEY"
          {
            echo "VITE_SUPABASE_URL=$API_URL"
            echo "VITE_SUPABASE_ANON_KEY=$ANON_KEY"
            echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY"
          } >> "$GITHUB_ENV"

      - name: Create demo auth users
        run: pnpm exec tsx scripts/seed-supabase.ts

      - name: pgTAP
        run: supabase test db

      - name: Integration tests against the local stack
        run: pnpm test
